spring.application.name=student-login-crud
# 本地/部署环境的私密配置（数据库口令、管理员口令等）放在 config/local.properties，
# 该文件已被 .gitignore 排除，不会进入仓库。参见 config/local.properties.example。
spring.config.import=optional:file:./config/local.properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_login_crud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.sql.init.mode=always
app.seed.candidate-profile=${CANDIDATE_PROFILE_SEED:src/main/resources/db/candidate_profile_excel_seed.sql}
app.seed.oj-reserved-account=${OJ_RESERVED_ACCOUNT_SEED:src/main/resources/db/oj_reserved_account_seed.sql}
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=org.example.studentlogincrud.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
app.admin.access-passphrase=${ADMIN_ACCESS_PASSPHRASE:}

# Set APP_PUBLIC_BASE_URL to the LAN IP or production domain used by mobile phones.
app.public-base-url=${APP_PUBLIC_BASE_URL:}

# ===================== OJ 爬虫配置 =====================
# 以下仅为首次启动的默认值：运行时在管理后台「爬虫配置」弹窗修改（存入数据库 app_config 表，保存即生效）。
# 上午/下午各一场比赛；比赛 ID 留空 = 关闭对应场次。
oj.base-url=${OJ_BASE_URL:https://oj.dsstudio.tech}
oj.contest-id-am=${OJ_CONTEST_ID_AM:}
oj.contest-id-pm=${OJ_CONTEST_ID_PM:}
# 上午/下午比赛密码；未分别配置时兼容旧的 OJ_CONTEST_PASSWORD
oj.contest-password-am=${OJ_CONTEST_PASSWORD_AM:${OJ_CONTEST_PASSWORD:}}
oj.contest-password-pm=${OJ_CONTEST_PASSWORD_PM:${OJ_CONTEST_PASSWORD:}}
# 登录 OJ 后的 Cookie（浏览器 F12 复制），格式：sessionid=xxx; csrftoken=xxx
oj.session-cookie=${OJ_SESSION_COOKIE:}
